<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English teacher</title>
<!-- Inline, so the browser's automatic /favicon.ico request doesn't 404. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%A4%96%3C/text%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --line: #e2e5ea;
    --text: #14171c;
    --muted: #6a7280;
    --accent: #2f6feb;
    --warn-bg: #fff6e5;
    --warn-line: #e8b552;
    --err: #c2372c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --panel: #1c2027;
      --line: #2c313a;
      --text: #e6e8ec;
      --muted: #9aa2ae;
      --accent: #6b9bff;
      --warn-bg: #33290f;
      --warn-line: #b98a25;
      --err: #ff8a7a;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  header.top {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header.top h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header.top .spacer { flex: 1; }
  #status { color: var(--muted); font-size: 13px; }

  button {
    font: inherit;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  main { flex: 1; display: flex; min-height: 0; }

  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

  .msg { padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.you { align-self: flex-end; max-width: 80%; background: var(--accent); color: #fff; }
  .msg.agent { align-self: flex-start; max-width: 90%; background: var(--panel); border: 1px solid var(--line); }
  .msg.error { align-self: flex-start; background: var(--panel); border: 1px solid var(--err); color: var(--err); }

  .notice { align-self: flex-start; color: var(--muted); font-size: 13px; }

  details.tool { align-self: flex-start; max-width: 90%; font-size: 13px; color: var(--muted); }
  details.tool summary { cursor: pointer; overflow-wrap: anywhere; }
  details.tool pre {
    margin: 6px 0 0;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    max-height: 260px;
    overflow: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  details.tool .label { color: var(--text); font-weight: 600; }

  .approval {
    align-self: stretch;
    border: 1px solid var(--warn-line);
    background: var(--warn-bg);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .approval h3 { margin: 0 0 8px; font-size: 14px; }
  .approval pre {
    margin: 0 0 10px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 13px;
  }
  .approval .buttons { display: flex; gap: 8px; }
  .approval .verdict { color: var(--muted); font-size: 13px; }

  form#composer {
    border-top: 1px solid var(--line);
    background: var(--panel);
    padding: 12px 16px;
  }
  form#composer .inner { flex-direction: row; align-items: flex-end; gap: 8px; }
  #input {
    flex: 1;
    resize: none;
    font: inherit;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 12px;
    max-height: 200px;
  }
  #input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
</style>
</head>
<body>
  <header class="top">
    <h1>English teacher</h1>
    <span id="status"></span>
    <span class="spacer"></span>
    <button id="reset">New chat</button>
  </header>

  <main>
    <section id="chat">
      <div id="log"><div class="inner" id="logInner"></div></div>
      <form id="composer">
        <div class="inner">
          <textarea id="input" rows="1" placeholder="Paste text to correct, or ask a grammar question — Enter sends, Shift+Enter adds a line" autofocus></textarea>
          <button type="submit" class="primary" id="send">Send</button>
        </div>
      </form>
    </section>
  </main>

<script>
"use strict";

const log = document.getElementById("logInner");
const scroller = document.getElementById("log");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const status = document.getElementById("status");
let busy = false;

// Every node is built with textContent, never innerHTML: the text on this page
// comes from a model and from tool output, and neither is trusted markup.
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function add(node) {
  const pinned = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80;
  log.appendChild(node);
  if (pinned) scroller.scrollTop = scroller.scrollHeight;
  return node;
}

function message(role, text) {
  return add(el("div", "msg " + role, text));
}

function notice(text) {
  return add(el("div", "notice", text));
}

function oneLine(s, max) {
  const flat = (s || "").replace(/\s+/g, " ").trim();
  return flat.length > max ? flat.slice(0, max) + "…" : flat;
}

// A tool call collapses to one line — the same line the terminal prints — and
// opens to the full arguments and result.
function toolCall(ev) {
  const box = el("details", "tool");
  const summary = el("summary");
  summary.appendChild(el("span", "label", "🔧 " + ev.name));
  summary.appendChild(document.createTextNode(" " + oneLine(ev.result, 90)));
  box.appendChild(summary);
  box.appendChild(el("pre", null, "args: " + (ev.args || "{}") + "\n\n" + (ev.result || "")));
  add(box);
}

// The human-in-the-loop gate. The tool is blocked on the other side of this
// card until a button is clicked, so it stays until answered.
function approval(ev) {
  const card = el("div", "approval");
  card.appendChild(el("h3", null, "⚠️ Approve this action?"));
  card.appendChild(el("pre", null, ev.action));

  const buttons = el("div", "buttons");
  const yes = el("button", "primary", "Approve");
  const no = el("button", null, "Deny");
  buttons.append(yes, no);
  card.appendChild(buttons);
  add(card);

  async function decide(approved) {
    yes.disabled = no.disabled = true;
    const res = await fetch("/api/approve", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: ev.id, approved: approved }),
    });
    buttons.replaceWith(el("div", "verdict",
      !res.ok ? "no longer waiting for an answer" :
      approved ? "approved" : "denied"));
  }
  yes.onclick = () => decide(true);
  no.onclick = () => decide(false);
}

function handle(ev) {
  switch (ev.type) {
    case "tool": toolCall(ev); break;
    case "approval": approval(ev); break;
    case "compact": notice("history compacted — " + oneLine(ev.text, 120)); break;
    case "answer": message("agent", ev.text); break;
    // Not an error: nobody answered the approval card, so the run parked itself
    // on disk. Nothing is running and nothing is lost — the decision can be
    // made from the terminal whenever, and the run picks up where it stopped.
    case "suspended":
      notice("waiting for a human — " + oneLine(ev.text, 120));
      notice("approve it with:  go run . -approve " + ev.id);
      break;
    case "error": message("error", ev.text); break;
  }
}

function setBusy(on) {
  busy = on;
  sendBtn.disabled = on;
  status.textContent = on ? "thinking…" : "";
}

// One turn is one streaming response. Events are newline-delimited "data:"
// lines, so they are parsed here rather than with EventSource, which cannot
// POST the question in the first place.
async function ask(text) {
  setBusy(true);
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    if (!res.ok) {
      message("error", (await res.text()).trim() || ("request failed: " + res.status));
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let cut;
      while ((cut = buffer.indexOf("\n\n")) >= 0) {
        const frame = buffer.slice(0, cut);
        buffer = buffer.slice(cut + 2);
        for (const line of frame.split("\n")) {
          if (line.startsWith("data: ")) handle(JSON.parse(line.slice(6)));
        }
      }
    }
  } catch (err) {
    message("error", "connection lost: " + err.message);
  } finally {
    setBusy(false);
  }
}

document.getElementById("composer").onsubmit = (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy) return;
  message("you", text);
  input.value = "";
  input.style.height = "auto";
  ask(text);
};

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    document.getElementById("composer").requestSubmit();
  }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 200) + "px";
});

document.getElementById("reset").onclick = async () => {
  if (busy) return;
  const res = await fetch("/api/reset", { method: "POST" });
  if (!res.ok) { message("error", (await res.text()).trim()); return; }
  log.replaceChildren();
  notice("new conversation — the agent has forgotten everything above");
};

notice("Paste text to have it corrected, or ask about a rule. Anything that would change your machine stops here for your approval first.");
</script>
</body>
</html>
